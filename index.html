<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таблетница</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>Таблетница</h1>

    <section id="meals" class="meals" aria-label="Лекарства по приёмам пищи"></section>
  </main>
</body>
</html>
